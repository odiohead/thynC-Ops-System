<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5CE5">
<title>thynC Ops — 연결 대기</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
    background: #f8fafc; color: #0f172a; text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #0a0f1c; color: #e2e8f0; } }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; margin-right: 8px; animation: pulse 1.2s infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 15px; opacity: .7; margin: 6px 0; line-height: 1.5; }
  button { margin-top: 18px; font: inherit; font-size: 15px; padding: 12px 22px; border-radius: 12px; border: 0; background: #2C5CE5; color: #fff; }
</style>
</head>
<body>
  <div>
    <h1><span class="dot"></span>서버에 연결할 수 없습니다</h1>
    <p>네트워크가 끊겼거나 서버가 재시작 중입니다.<br>연결되면 자동으로 다시 엽니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
  <script>
    // 서비스 워커(/m-sw.js)가 대신 응답한 페이지 — 주소창 URL은 원래 화면 그대로라 reload 로 복귀
    function tick() {
      fetch('/api/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) location.reload(); else setTimeout(tick, 5000) })
        .catch(function () { setTimeout(tick, 5000) })
    }
    setTimeout(tick, 5000)
  </script>
</body>
</html>
