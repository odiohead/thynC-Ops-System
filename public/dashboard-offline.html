<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thynC 대시보드 — 서버 연결 대기</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
    background: #f8fafc; color: #0f172a;
  }
  @media (prefers-color-scheme: dark) { body { background: #0a0f1c; color: #e2e8f0; } }
  .box { text-align: center; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #f59e0b; margin-right: 10px; animation: pulse 1.2s infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px; }
  p { font-size: 16px; opacity: .7; margin: 6px 0; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="box">
    <h1><span class="dot"></span>서버 연결 대기 중</h1>
    <p>서버가 재시작 중입니다. 복구되면 대시보드를 자동으로 다시 엽니다.</p>
    <p class="mono">재시도 <span id="n">0</span>회 · 마지막 시도 <span id="t">-</span></p>
  </div>
  <script>
    /*
     * 사이니지 자동 복구 — 서비스 워커(/sw.js)가 서버 다운 시 이 페이지를 대신 응답한다.
     * 주소창 URL은 원래 대시보드 URL(/dashboard?view=...) 그대로이므로,
     * /api/health 가 200을 돌려주면 location.reload() 로 원래 페이지를 재요청한다.
     * 재요청도 실패하면 SW가 다시 이 페이지를 응답 → 루프 지속.
     */
    var INTERVAL_MS = 5000
    var n = 0
    function tick() {
      n += 1
      document.getElementById('n').textContent = n
      document.getElementById('t').textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false })
      fetch('/api/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) location.reload(); else setTimeout(tick, INTERVAL_MS) })
        .catch(function () { setTimeout(tick, INTERVAL_MS) })
    }
    setTimeout(tick, INTERVAL_MS)
  </script>
</body>
</html>
